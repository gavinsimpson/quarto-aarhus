title: Aarhus University Presentation Template
author: Gavin L. Simpson
version: 0.1.9
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      shortcodes: [fontawesome]
      au-orcid-icon: "{{< fa brands orcid >}}"
      theme: [default, aarhus.scss]
      filters: [aarhus.lua]
      template-partials: [title-slide.html]
      slide-level: 2
      width: 960
      # Private unset marker; the Lua filter sets the ratio-specific height.
      height: 0
      center: false
      margin: 0
      controls: false
      menu: false
      progress: false
      slide-number: false
      transition: none
      auto-stretch: false
      revealjs-plugins: [plugin]
